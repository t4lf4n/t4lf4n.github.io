<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Xem giá tham khảo bộ phích cắm và đầu nối MENNEKES 2177A, 2175B rồi gửi yêu cầu báo giá trực tuyến.">
  <title>Giá tham khảo MENNEKES 2177A và 2175B</title>
  <style>
    :root{--primary:#e50046;--dark:#b00036;--soft:#fff0f5;--bg:#f5f6f7;--text:#182226;--muted:#6b7880;--line:#dce5e8;--danger:#bf3030}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 0 0,rgba(229,0,70,.1),transparent 35%),var(--bg)}
    button,input,select{font:inherit}button:disabled{cursor:not-allowed;opacity:.48}
    .app{width:min(1180px,calc(100% - 28px));min-height:calc(100vh - 52px);margin:26px auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 18px 55px rgba(20,50,60,.12)}
    .main{display:flex;min-width:0;flex-direction:column;border-right:1px solid var(--line)}.header{min-height:82px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)}
    .identity{display:flex;align-items:center;gap:12px;min-width:0}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--dark));font-weight:900}h1{margin:0;font-size:18px}.status{margin-top:4px;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#22a668;box-shadow:0 0 0 4px rgba(34,166,104,.12)}
    .ghost{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:var(--muted);cursor:pointer}.ghost:hover{border-color:var(--primary);color:var(--dark);background:var(--soft)}
    .chat{flex:1;min-height:470px;padding:24px clamp(14px,3vw,32px) 34px;overflow:auto;background:linear-gradient(rgba(244,247,248,.45),rgba(244,247,248,.45)),radial-gradient(circle at 100% 0,rgba(229,0,70,.05),transparent 38%)}
    .row{display:flex;margin:0 0 14px}.row.user{justify-content:flex-end}.bubble{max-width:min(680px,90%);padding:12px 15px;border-radius:16px;line-height:1.48;font-size:15px;overflow-wrap:anywhere}.row.bot .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 6px 18px rgba(36,65,74,.06)}.row.user .bubble{color:#fff;background:var(--primary);border-bottom-right-radius:5px}.bubble.error{color:#8b2525;background:#fff0f0}.bubble.success{color:#125f3d;background:#edf8f2}
    .choices{margin:4px 0 22px;display:flex;flex-wrap:wrap;gap:9px}.choice{max-width:100%;border:1px solid #e7b4c4;border-radius:999px;padding:10px 15px;color:var(--dark);background:#fff;cursor:pointer;font-weight:700;line-height:1.35;text-align:left}.choice:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}.choice.primary{color:#fff;border-color:var(--primary);background:var(--primary)}.choice-note{margin-left:5px;font-size:12px;color:var(--muted);font-weight:600}.choice.model-choice{min-width:min(300px,100%);max-width:min(430px,100%);padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;border-radius:14px}.choice.back-choice{color:var(--muted);border-color:var(--line);background:#f8fafb}
    .phone-panel,.qty-panel,.select-panel,.search-panel{width:min(650px,100%);margin:5px 0 22px;padding:14px;display:flex;gap:10px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 6px 18px rgba(36,65,74,.05)}.phone-panel{width:min(480px,100%);flex-direction:column;gap:8px}.phone-panel label{font-size:13px;font-weight:800}.phone-panel input{width:100%;height:46px;padding:0 13px;border:1px solid #b9c9ce;border-radius:11px}.phone-help{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.phone-error,.qty-error{width:100%;min-height:18px;margin:0;color:var(--danger);font-size:12px;font-weight:700}.phone-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
    .side{padding:22px;display:flex;flex-direction:column;background:#fbfcfc}.side h2{margin:0 0 4px;font-size:17px}.side-sub{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.5}.cart{flex:1;min-height:110px;display:flex;flex-direction:column;gap:10px}.empty{padding:26px 14px;text-align:center;color:var(--muted);border:1px dashed #cbd7da;border-radius:15px;background:#fff;font-size:13px}.cart-item{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.cart-title{font-weight:750;font-size:13px}.cart-meta,.cart-total{margin-top:7px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.cart-total{font-size:13px;color:var(--text);font-weight:800}.remove{padding:0;border:0;background:transparent;color:var(--danger);cursor:pointer}
    .summary{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.summary-row{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;color:var(--muted);font-size:13px}.summary-row.total{margin-top:12px;color:var(--text);font-size:18px;font-weight:850}.note{margin-top:18px;padding:12px;color:var(--muted);background:#f1f5f6;border-radius:12px;font-size:12px;line-height:1.45}
    .quote{margin-top:11px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.quote-meta{padding:12px 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;background:#f8fafb}.table-scroll{overflow-x:auto}table{width:100%;min-width:720px;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.num{text-align:right}
    .mobile-cart{display:none;align-items:center;gap:8px;color:var(--dark);font-weight:800;font-size:13px}.mobile-cart span{min-width:24px;height:24px;padding:0 7px;display:grid;place-items:center;border-radius:999px;color:#fff;background:var(--primary)}
    @media(max-width:840px){.app{width:100%;min-height:100vh;margin:0;grid-template-columns:1fr;border:0;border-radius:0}.main{border:0}.side{display:none}.mobile-cart{display:flex}.header{position:sticky;top:0;z-index:10}.chat{min-height:calc(100vh - 82px)}.choice.model-choice{width:100%;max-width:100%}}
  </style>
</head>
<body>
<main class="app">
  <section class="main">
    <header class="header">
      <div class="identity">
        <div class="icon" aria-hidden="true">M</div>
        <div>
          <h1>Bộ MENNEKES 2177A + 2175B</h1>
          <div class="status"><span class="dot"></span><span id="catalogCount">Đang tải giá tham khảo…</span></div>
        </div>
      </div>
      <div class="mobile-cart">Đã chọn <span id="mobileCount">0</span></div>
      <button class="ghost" id="reset" type="button">Chọn sản phẩm khác</button>
    </header>
    <div class="chat" id="chat" aria-live="polite">
      <div class="row bot"><div class="bubble">Đang chuẩn bị báo giá tham khảo…</div></div>
      <noscript><div class="row bot"><div class="bubble error">Trình duyệt cần bật JavaScript để xem báo giá.</div></div></noscript>
    </div>
  </section>
  <aside class="side">
    <h2>Sản phẩm đang xem</h2>
    <p class="side-sub">2177A · 1 cái<br>2175B · 1 cái</p>
    <div class="cart" id="cart"></div>
    <div class="summary">
      <div class="summary-row"><span>Số mặt hàng</span><strong id="lineCount">0</strong></div>
      <div class="summary-row"><span>Tổng số lượng</span><strong id="unitCount">0</strong></div>
      <div class="summary-row total"><span>Giá tham khảo</span><span id="grandTotal">0 ₫</span></div>
    </div>
    <div class="note">Đơn giá tham khảo theo bảng giá MENNEKES 2025. Công ty sẽ liên hệ xác nhận khi nhận được yêu cầu.</div>
  </aside>
</main>
<script src="config.js"></script>
<script src="catalog-data.js"></script>
<script src="cadivi-catalog-data.js"></script>
<script src="mitsubishi-catalog-data.js"></script>
<script src="mennekes-catalog-data.js"></script>
<script src="chint-catalog-data.js"></script>
<script src="autonics-catalog-data.js"></script>
<script src="schneider-catalog-data.js"></script>
<script src="nanoco-catalog-data.js"></script>
<script>
  window.QUOTE_PRESELECT = {
    heading: "Giá tham khảo bộ MENNEKES 2177A + 2175B",
    items: [
      {brand: "MENNEKES", productId: "MENNEKES-0034", quantity: 1},
      {brand: "MENNEKES", productId: "MENNEKES-0001", quantity: 1}
    ]
  };
</script>
<script src="app.js"></script>
</body>
</html>
